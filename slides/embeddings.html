*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);

/* ---------- escenario 16:9 ---------- */
#viewport{width:100vw;height:100vh;display:grid;place-items:center;position:relative}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;
  background:var(--paper);flex:none}
.slide{position:absolute;inset:0;display:none;flex-direction:column;
  padding:52px 68px 78px;background:var(--paper)}
.slide.on{display:flex}

/* ---------- cinta inferior ---------- */
.ribbon{position:absolute;left:0;right:0;bottom:0;height:44px;background:var(--green-deep);
  display:flex;align-items:center;gap:18px;padding:0 24px 0 28px;color:#fff}
.ribbon img{height:19px;width:auto;opacity:.95;flex:none}
.ribbon .sep{width:1px;height:18px;background:rgba(255,255,255,.28);flex:none}
.ribbon .where{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ribbon .num{margin-left:auto;font-family:var(--f-mono);font-size:12px;
  color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums;flex:none}

/* ---------- tipografía ---------- */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--green-ink);margin:0 0 12px}
h1{font-family:var(--f-display);font-weight:800;font-size:62px;line-height:1.02;margin:0;
  letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:40px;line-height:1.08;margin:0 0 6px;
  letter-spacing:-.015em;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 6px;letter-spacing:-.005em}
.lede{font-size:20px;line-height:1.45;color:var(--ink-soft);margin:0;max-width:62ch}
.body{font-size:17.5px;line-height:1.5;color:var(--ink-soft);margin:0;max-width:64ch}
.small{font-size:15px;line-height:1.45;color:var(--ink-faint);margin:0}
strong{color:var(--ink);font-weight:600}
em{font-style:normal;color:var(--green-ink);font-weight:600}
code{font-family:var(--f-mono);font-size:.92em;background:var(--surface-2);
  padding:1px 5px;border-radius:3px;color:var(--ink)}
.head{margin-bottom:22px;flex:none}
.fill{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.cols{display:grid;gap:26px}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:repeat(3,1fr)}
.c2-38{grid-template-columns:.62fr 1fr}
.c2-62{grid-template-columns:1fr .62fr}
.vlist{display:flex;flex-direction:column;gap:14px}

/* ---------- piezas ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:18px 20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--surface-2);border-color:transparent}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--green-tint);
  color:var(--green-ink);white-space:nowrap}
.tag.pos{background:var(--c-pos-soft);color:var(--c-pos)}
.tag.neg{background:var(--c-neg-soft);color:var(--c-5)}
ul.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;
  font-size:17px;line-height:1.42;color:var(--ink-soft)}
ul.ticks li{padding-left:22px;position:relative}
ul.ticks li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:2px;
  background:var(--green);border-radius:2px}
ul.ticks.pro li::before{background:var(--c-pos)}
ul.ticks.con li::before{background:var(--c-neg)}
table{border-collapse:collapse;width:100%;font-size:16px}
th{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);text-align:left;font-weight:400;padding:0 14px 9px 0;
  border-bottom:1px solid var(--rule);vertical-align:bottom}
td{padding:11px 14px 11px 0;border-bottom:1px solid var(--rule);color:var(--ink-soft);
  vertical-align:top;line-height:1.38}
tr:last-child td{border-bottom:none}
td.k{color:var(--ink);font-weight:500}
.num-col{font-variant-numeric:tabular-nums}
figure{margin:0;display:flex;flex-direction:column;gap:9px;align-items:center}
figure svg{max-width:100%;height:auto;display:block;color:var(--ink)}
figcaption{font-size:14px;line-height:1.4;color:var(--ink-faint);text-align:center;max-width:72ch}
pre{margin:0;font-family:var(--f-mono);font-size:14.5px;line-height:1.62;
  background:var(--surface);border:1px solid var(--rule);border-radius:9px;
  padding:16px 18px;overflow-x:auto;color:var(--ink);box-shadow:var(--shadow)}
pre .kw{color:var(--c-3)} pre .st{color:var(--c-pos)} pre .cm{color:var(--ink-faint);font-style:italic}
pre .fn{color:var(--green-ink)} pre .nu{color:var(--c-5)}
pre .todo{background:var(--c-neg-soft);color:var(--c-5);border-radius:3px;padding:0 4px}
.formula{font-family:var(--f-mono);font-size:19px;color:var(--ink);background:var(--surface-2);
  border-left:3px solid var(--green);border-radius:0 7px 7px 0;padding:13px 18px;line-height:1.6}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;color:var(--green-ink)}
.kpi span{font-size:14px;color:var(--ink-faint)}

/* ---------- portada y divisores ---------- */
.cover,.divider{background:var(--green-deep);color:#fff;padding:0}
.cover .inner,.divider .inner{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:64px 68px 88px;position:relative;z-index:1}
.cover h1,.divider h1{color:#fff;font-size:74px}
.cover .lede,.divider .lede{color:rgba(255,255,255,.76)}

.divider .num{font-family:var(--f-display);font-size:150px;font-weight:800;line-height:.8;
  color:rgba(255,255,255,.17);margin:0 0 10px;letter-spacing:-.04em}
.divider .plan{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.divider .plan span{font-family:var(--f-mono);font-size:12.5px;padding:6px 12px;border-radius:99px;
  border:1px solid rgba(255,255,255,.26);color:rgba(255,255,255,.82)}
.cover .ribbon,.divider .ribbon{background:rgba(0,0,0,.26)}

/* receso */
.pausa{background:var(--green-tint)}
.pausa .inner{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.pausa h1{font-size:66px;color:var(--green-ink)}

/* ---------- notas del ponente ---------- */
#notes{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--green);
  padding:14px 20px;font-size:15px;line-height:1.5;color:var(--ink-soft);max-height:32vh;overflow-y:auto;
  z-index:40;box-shadow:0 -8px 24px rgba(0,0,0,.13)}
#notes b{color:var(--ink)}
.notes{display:none}
body:not(.show-notes) #notes{display:none}

/* ---------- índice ---------- */
#index{position:fixed;inset:0;background:var(--paper);z-index:50;overflow-y:auto;padding:36px 44px 60px}
body:not(.show-index) #index{display:none}
#index h2{margin-bottom:20px}
.idx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.idx-grid h3{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--green-ink);border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:10px}
.idx-grid ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.idx-grid button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;
  font:inherit;font-size:14.5px;color:var(--ink-soft);padding:5px 7px;border-radius:5px;cursor:pointer}
.idx-grid button:hover{background:var(--surface-2);color:var(--ink)}
.idx-grid button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.idx-grid button i{font-family:var(--f-mono);font-style:normal;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;flex:none;min-width:20px}
.idx-grid button.cur{background:var(--green-tint);color:var(--green-ink);font-weight:500}

#help{position:fixed;right:14px;top:12px;z-index:60;font-family:var(--f-mono);font-size:11px;
  letter-spacing:.06em;color:var(--ink-faint);background:var(--surface);border:1px solid var(--rule);

#help:hover{opacity:1}

@media (prefers-reduced-motion:no-preference){

@page{size:1280px 720px;margin:0}
@media print{

    break-after:page;box-shadow:none}
  #help,#notes,#index{display:none!important}
}

<section class="slide" data-sec="Sesión 1 · Recap de redes" data-title="Vocabulario que vamos a usar">

    <table>
      <thead><tr><th style="width:19%">Término</th><th style="width:44%">Qué es</th><th>Por qué nos importa</th></tr></thead>
      <tbody>
        <tr><td class="k">Backbone</td><td>La red convolucional o transformer que convierte la imagen en un vector.</td><td>Es lo que se reusa. Casi nunca se entrena desde cero.</td></tr>
        <tr><td class="k">Head</td><td>Las capas que van después del backbone.</td><td>Aquí decides qué significa la salida. Cambiarlo cambia el problema.</td></tr>

<!-- ============ PROBLEMA 3 ============ -->
<section class="slide" data-sec="Sesión 1 · El problema" data-title="Cuándo NO usar embeddings">
  <div class="head">
    <p class="eyebrow">El problema · 3 de 3</p>
    <h2>El lado incómodo</h2>
  </div>
  <div class="fill">
    <div class="cols c2">
      <div class="card">
        <span class="tag pos">A favor</span>
        <ul class="ticks pro" style="margin-top:14px">
          <li>Agregar una clase cuesta <strong>una inferencia</strong>, no un reentrenamiento.</li>
          <li>Funciona con 1–5 ejemplos por identidad.</li>
          <li>Un solo modelo sirve para buscar, verificar, agrupar y deduplicar.</li>
          <li>El catálogo es una tabla: auditable, editable, borrable.</li>
        </ul>
      </div>
      <div class="card">
        <span class="tag neg">En contra</span>
        <ul class="ticks con" style="margin-top:14px">
          <li>Hay que <strong>elegir un umbral</strong>, y ese umbral es una decisión de negocio, no de ingeniería.</li>
          <li>Entrenar es más delicado: la pérdida y el muestreo importan más que la arquitectura.</li>
          <li>Evaluar es más caro: necesitas pares o un protocolo de galería, no un simple accuracy.</li>
          <li>En inferencia necesitas <strong>infraestructura de búsqueda</strong>, no solo el modelo.</li>
        </ul>
      </div>
    </div>
    <div class="card flat" style="margin-top:22px">
      <p class="body" style="max-width:none"><strong>Si tus clases son fijas y tienes miles de ejemplos de cada una, usa un clasificador.</strong> Es más simple, más rápido de evaluar y más fácil de explicar. Los embeddings resuelven un problema que no todos tienen.</p>
    </div>
  </div>
  <div class="notes">Importante decir esto en voz alta: no queremos que salgan usando embeddings para todo. La pregunta correcta es si la lista de clases está cerrada.</div>
</section>

<section class="slide" data-sec="Sesión 1 · Funciones de pérdida" data-title="Contrastive y triplet">
  <div class="head">
    <p class="eyebrow">Pérdidas · 2 de 8</p>
    <h2>La familia clásica: comparar pares y tercias</h2>
  </div>
  <div class="fill">
    <div class="cols c2-62" style="align-items:center">
      <figure>
        <svg viewBox="0 0 600 300" role="img" aria-label="Regla de distancias desde el ancla. Si el negativo ya está más lejos que el positivo más el margen, la pérdida es cero; si invade la banda del margen, la pérdida es lo que invade y el gradiente lo empuja hacia afuera.">
          <defs><marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--c-5)"/></marker></defs>
          <text x="40" y="36" font-size="13.5" font-weight="600" fill="currentColor">Caso 1 · el negativo ya está lejos</text>
          <rect x="200" y="62" width="120" height="36" fill="currentColor" fill-opacity=".09"/>
          <line x1="40" y1="80" x2="580" y2="80" stroke="currentColor" stroke-width="1.4" opacity=".4"/>
          <text x="260" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">m</text>
          <circle cx="60" cy="80" r="9" fill="var(--ink)"/>
          <circle cx="200" cy="80" r="8" fill="var(--c-pos)"/>
          <rect x="442" y="72" width="16" height="16" rx="2.5" fill="var(--c-neg)"/>
          <text x="60" y="110" text-anchor="middle" font-size="12" fill="currentColor">ancla</text>
          <text x="200" y="110" text-anchor="middle" font-size="12" fill="var(--c-pos)" font-weight="600">positivo</text>
          <text x="450" y="110" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600">negativo</text>
          <text x="40" y="138" font-size="13" fill="currentColor" opacity=".8">d(a,n) ≥ d(a,p) + m  ⇒  L = 0: no hay nada que aprender</text>
          <text x="40" y="178" font-size="13.5" font-weight="600" fill="currentColor">Caso 2 · el negativo invade la banda</text>
          <rect x="200" y="204" width="120" height="36" fill="currentColor" fill-opacity=".09"/>
          <line x1="40" y1="222" x2="580" y2="222" stroke="currentColor" stroke-width="1.4" opacity=".4"/>
          <rect x="272" y="204" width="48" height="36" fill="var(--c-5)" fill-opacity=".28"/>

          <text x="286" y="188" font-size="11.5" font-weight="600" fill="var(--c-5)">lo empuja</text>
          <circle cx="60" cy="222" r="9" fill="var(--ink)"/>
          <circle cx="200" cy="222" r="8" fill="var(--c-pos)"/>
          <rect x="264" y="214" width="16" height="16" rx="2.5" fill="var(--c-neg)"/>
          <text x="60" y="252" text-anchor="middle" font-size="12" fill="currentColor">ancla</text>
          <text x="200" y="252" text-anchor="middle" font-size="12" fill="var(--c-pos)" font-weight="600">positivo</text>
          <text x="272" y="252" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600">negativo</text>
          <text x="40" y="280" font-size="13" fill="currentColor" opacity=".8">L = d(a,p) + m − d(a,n): exactamente el tramo invadido</text>
        </svg>
        <figcaption>Distancias medidas desde el ancla sobre una recta. La banda gris mide m y empieza en el positivo: el negativo tiene que quedar fuera de ella.</figcaption>
      </figure>
      <div class="vlist">
        <div class="card">
          <h3>Triplet</h3>
          <div class="formula" style="font-size:15.5px;padding:10px 13px;margin:6px 0 8px">L = max(0, d(a,p) − d(a,n) + m)</div>
          <p class="small" style="color:var(--ink-soft)">Pide que el negativo quede al menos <strong>m más lejos</strong> que el positivo. No le importan las distancias absolutas, solo el orden.</p>
        </div>
        <div class="card">
          <h3>Contrastive</h3>
          <div class="formula" style="font-size:15.5px;padding:10px 13px;margin:6px 0 8px">L = y·d² + (1 − y)·max(0, m − d)²</div>
          <p class="small" style="color:var(--ink-soft)">Trabaja con <strong>pares</strong>; y = 1 si son la misma identidad. Acerca los iguales hasta d = 0 y aleja los distintos solo hasta m.</p>

        <div class="formula" style="font-size:16px;line-height:1.8">logit<sub>j</sub> = W<sub>j</sub>ᵀz + b<sub>j</sub><span style="color:var(--ink-faint);font-size:13.5px">&nbsp; ← la capa FC de siempre</span><br>&nbsp;&nbsp;→ W<sub>j</sub>ᵀz<span style="color:var(--ink-faint);font-size:13.5px">&nbsp; ← fuera b<sub>j</sub>: es una constante por clase, no mide parecido</span><br>&nbsp;&nbsp;→ cos θ<sub>j</sub><span style="color:var(--ink-faint);font-size:13.5px">&nbsp; ← con ‖W<sub>j</sub>‖ = ‖z‖ = 1</span></div>

          <li>El softmax jala z hacia su prototipo y lo aleja de <strong>todos los demás a la vez</strong>: no hay negativos que minar.</li>

<section class="slide" data-sec="Sesión 1 · Funciones de pérdida" data-title="ArcFace: el margen angular">
  <div class="head">
    <p class="eyebrow">Pérdidas · 5 de 8</p>
    <h2>Y ahora el margen: ArcFace</h2>
  </div>
  <div class="fill">
    <div class="cols c2" style="align-items:center">
      <div class="vlist">
        <p class="body" style="max-width:none">Un solo cambio sobre la lámina anterior: en la clase correcta, <strong>cos θ<sub>y</sub> → cos(θ<sub>y</sub> + m)</strong>. Tiene que ganar por un ángulo, no apenas.</p>
        <div class="formula" style="font-size:16px;line-height:1.95">logit<sub>y</sub> = s · cos(θ<sub>y</sub> + m)<span style="color:var(--ink-faint);font-size:13.5px">   ← la clase correcta, con margen</span><br>logit<sub>j</sub> = s · cos θ<sub>j</sub><span style="color:var(--ink-faint);font-size:13.5px">        ← todas las demás, sin margen</span><br>L = cross_entropy(logits, y)</div>
        <table>
          <thead><tr><th style="width:22%">Parámetro</th><th style="width:20%">Típico</th><th>Qué controla</th></tr></thead>
          <tbody>
            <tr><td class="k">m</td><td class="num-col">0.3 – 0.5 rad</td><td>Qué tan lejos deben quedar los cúmulos. Subirlo endurece; pasarse impide converger.</td></tr>
            <tr><td class="k">s</td><td class="num-col">16 – 64</td><td>Escala los logits. Sin él, un coseno acotado en [−1, 1] no da gradiente suficiente.</td></tr>
          </tbody>
        </table>
        <div class="card flat">

  <div class="notes">Si preguntan por qué sumar al ángulo y no al coseno: el ángulo es una distancia geodésica sobre la esfera, así que el margen es constante en toda la esfera. Con cos θ − m el margen efectivo cambia según dónde estés. <b>Si preguntan por qué cada nueva frontera está a m/2 de la original:</b> entre los dos prototipos θ₁ + θ₂ es fijo (120° en el dibujo), así que θ₁ + m &lt; θ₂ equivale a θ₁ &lt; 60° − m/2: acercarse m/2 baja θ₁ en m/2 y sube θ₂ en m/2. Es el caso 2D; en alta dimensión la regla general es θ₁ + m &lt; θⱼ contra el rival más cercano. Y en inferencia no hay margen: es solo una exigencia de entrenamiento.</div>
</section>

<section class="slide" data-sec="Sesión 1 · Funciones de pérdida" data-title="ArcFace sin acos">
  <div class="head">
    <p class="eyebrow">Pérdidas · 7 de 8</p>
    <h2>Cómo se calcula en producción: sin acos</h2>
  </div>
  <div class="fill">
    <div class="cols c2" style="align-items:start">
      <div class="vlist">
        <div class="formula" style="line-height:1.9">cos(θ + m) = cos θ · cos m − sin θ · sin m<br><span style="font-size:15px;color:var(--ink-faint)">sin θ = √(1 − cos²θ) &nbsp;·&nbsp; cos m y sin m son constantes</span></div>
        <ul class="ticks">
          <li><strong>No se llama <code>acos</code></strong>: su derivada es infinita en ±1, que es justo el bug que hoy ataja el <code>clamp</code> de nuestra versión.</li>
          <li><strong>Todo sale del coseno que ya se calculó.</strong> cos m y sin m se calculan una vez, al construir la capa.</li>
          <li>Es como lo implementan insightface y la mayoría de los repos de producción.</li>
        </ul>
      </div>
      <div class="vlist">
        <div class="card" style="border-color:var(--green);border-width:1.5px">
          <span class="tag">Punto extra</span>
          <h3 style="margin-top:12px">Implementen ArcFace así</h3>
          <p class="small" style="color:var(--ink-soft)">El código que les damos usa <code>acos</code>, que se lee más fácil. Reescribirlo con la identidad trigonométrica es un punto extra.</p>
        </div>
        <div class="card">
          <h3>El reto</h3>
          <p class="small" style="color:var(--ink-soft)">Cuando θ + m &gt; π, cos(θ + m) vuelve a subir (lámina anterior). Su versión tiene que conservar la monotonía en esa zona. Pista: basta con mirar cos θ; no necesitan θ.</p>
        </div>
        <div class="card flat">
          <p class="small" style="color:var(--ink-soft)"><strong>Cómo se califica:</strong> los mismos logits que la versión con <code>acos</code> donde θ + m ≤ π, y pérdida finita cuando cos θ = ±1.</p>
        </div>
      </div>
    </div>
  </div>
  <div class="notes">La solución completa está en _solucion/acordeon.md, que no se versiona.</div>
</section>

<section class="slide" data-sec="Sesión 1 · Funciones de pérdida" data-title="Por qué ArcFace desplazó a triplet">
  <div class="head">
    <p class="eyebrow">Pérdidas · 8 de 8</p>
    <h2>Por qué usamos ArcFace en el ejercicio</h2>
  </div>
  <div class="fill">
    <table>
      <thead><tr><th style="width:24%"></th><th style="width:38%">Triplet + minería</th><th>ArcFace</th></tr></thead>
      <tbody>
        <tr><td class="k">Muestreo</td><td>Necesita batches PK y minería en línea. Es la mitad del código y casi todos los bugs.</td><td class="k" style="color:var(--green-ink)">Batches aleatorios. No hay muestreo que diseñar.</td></tr>
        <tr><td class="k">Convergencia</td><td>Frágil. Sensible al margen, al batch y a las etiquetas ruidosas.</td><td class="k" style="color:var(--green-ink)">Estable. Se comporta como entrenar un clasificador normal.</td></tr>
        <tr><td class="k">Señal por paso</td><td>Una tercia por ancla. La mayoría con gradiente cero.</td><td class="k" style="color:var(--green-ink)">Cada muestra contra todos los centros de clase.</td></tr>
        <tr><td class="k">Costo en memoria</td><td>Bajo.</td><td>Una matriz <code>dim × N_clases</code>. Con 100 000 identidades sí pesa.</td></tr>
        <tr><td class="k">Requisito</td><td>Solo pares positivos. Sirve sin etiquetas de clase.</td><td>Necesita <strong>etiquetas de identidad</strong> en entrenamiento.</td></tr>
      </tbody>
    </table>
    <div class="card flat" style="margin-top:22px">
      <p class="body" style="max-width:none">Triplet no está mal: está <strong>superado</strong> para el caso normal. Sigue siendo la opción cuando no tienes etiquetas discretas, cuando las identidades son millones, o cuando entrenas con pares que vienen de otra señal. Para todo lo demás, empieza con ArcFace.</p>
    </div>
  </div>
  <div class="notes">Aquí anuncia el extra: quien implemente triplet y muestre la comparación se lleva punto extra. Es la mejor forma de que lo entiendan de verdad.</div>
</section>

          <p class="small" style="margin-top:8px"><strong>Qué hacer:</strong> reportar métricas <em>por subgrupo</em>, no solo globales.</p>
        </div>

      </div>
      <div class="vlist">
        <div class="card">
          <h3>El umbral envejece</h3>
          <p class="small" style="color:var(--ink-soft)">Al crecer el catálogo, la probabilidad de que <em>alguien</em> se parezca sube. El mismo umbral produce más falsas aceptaciones cada mes sin que nada haya cambiado en el modelo.</p>
        </div>
        <div class="card">
          <h3>Un embedding es dato personal</h3>
          <p class="small" style="color:var(--ink-soft)">De un vector facial se puede reconstruir una cara aproximada, y funciona como identificador único entre sistemas. Un catálogo de embeddings se protege como una base de datos biométrica, porque lo es.</p>
        </div>
      </div>
    </div>

<section class="slide" data-sec="Sesión 2 · El código" data-title="El modelo">
  <div class="head">
    <p class="eyebrow">El código · 2 de 4</p>
    <h2>El modelo: backbone intercambiable, head fijo</h2>
  </div>
  <div class="fill">
    <div class="cols c2" style="align-items:start">
<pre><span class="kw">class</span> <span class="fn">EmbeddingModel</span>(nn.Module):
    <span class="kw">def</span> <span class="fn">__init__</span>(self, backbone=<span class="st">"resnet18"</span>, dim=<span class="nu">128</span>):
        super().__init__()
        self.backbone, feat_dim = build_backbone(backbone)
        <span class="cm"># head base: una capa oculta y salida a `dim`</span>
        self.head = nn.Sequential(
            nn.Linear(feat_dim, <span class="nu">512</span>),
            nn.BatchNorm1d(<span class="nu">512</span>),
            nn.ReLU(inplace=<span class="kw">True</span>),
            nn.Linear(<span class="nu">512</span>, dim),
        )

    <span class="kw">def</span> <span class="fn">forward</span>(self, x):
        z = self.head(self.backbone(x))
        <span class="cm"># sin esta línea, nada de lo demás funciona</span>
        <span class="kw">return</span> F.normalize(z, p=<span class="nu">2</span>, dim=<span class="nu">1</span>)</pre>
      <div class="vlist">
        <table>
          <thead><tr><th style="width:38%">Backbone</th><th>Para quién</th></tr></thead>
          <tbody>
            <tr><td class="k"><code>small_cnn</code></td><td>28×28 en gris. Corre en CPU. El del sintético y Omniglot.</td></tr>
            <tr><td class="k"><code>resnet18</code></td><td>Preentrenada. La opción por defecto si hay GPU o Mac con MPS.</td></tr>
            <tr><td class="k"><code>mobilenet_v3_small</code></td><td>Ligera y preentrenada. El punto medio.</td></tr>
          </tbody>
        </table>
        <div class="card flat">
          <p class="small" style="color:var(--ink-soft)"><strong>Se vale cambiar el head.</strong> Ponerle 3 o 4 capas es un extra válido — pero repórtenlo con la ablación, porque casi siempre <em>no</em> ayuda, y descubrir eso vale más que el punto.</p>
        </div>
        <div class="card flat">
          <p class="small" style="color:var(--ink-soft)"><strong>Ojo con BatchNorm:</strong> con batches muy chicos se vuelve inestable. Si tienen que bajar a <code>batch_size=8</code>, cámbienlo por <code>nn.LayerNorm</code>.</p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ CODIGO: ARCFACE ============ -->
<section class="slide" data-sec="Sesión 2 · El código" data-title="ArcFace en código">
  <div class="head">
    <p class="eyebrow">El código · 3 de 4</p>
    <h2>ArcFace: la lámina de la sesión 1, en 12 líneas</h2>
  </div>
  <div class="fill">
    <div class="cols c2" style="align-items:start">
<pre><span class="kw">class</span> <span class="fn">ArcFace</span>(nn.Module):
    <span class="kw">def</span> <span class="fn">__init__</span>(self, dim, n_classes, s=<span class="nu">30.0</span>, m=<span class="nu">0.4</span>):
        super().__init__()
        <span class="cm"># cada fila es el centro de una clase en la esfera</span>
        self.W = nn.Parameter(torch.randn(n_classes, dim))
        nn.init.xavier_normal_(self.W)
        self.s, self.m = s, m

    <span class="kw">def</span> <span class="fn">forward</span>(self, z, labels):
        <span class="cm"># z ya viene normalizado; normalizamos también W</span>
        cos = F.linear(z, F.normalize(self.W, dim=<span class="nu">1</span>))
        <span class="cm"># clamp: evita NaN en acos cuando cos roza ±1</span>
        theta = torch.acos(cos.clamp(-<span class="nu">1</span> + <span class="nu">1e-7</span>, <span class="nu">1</span> - <span class="nu">1e-7</span>))
        <span class="cm"># el margen se suma SOLO en la clase correcta</span>
        target = F.one_hot(labels, cos.size(<span class="nu">1</span>)).bool()
        logits = torch.where(target, torch.cos(theta + self.m), cos)
        <span class="kw">return</span> F.cross_entropy(self.s * logits, labels)</pre>
      <div class="vlist">
        <div class="card">
          <h3>Lo que hay que ver</h3>
          <ul class="ticks" style="font-size:15.5px;gap:9px;margin-top:8px">
            <li><code>W</code> tiene una fila por clase de <strong>entrenamiento</strong>. Es lo que se descarta al terminar.</li>
            <li>El margen entra <strong>solo en la columna correcta</strong>; las demás quedan con su coseno.</li>
            <li>Al final es un <code>cross_entropy</code> común. Por eso entrena tan estable.</li>
          </ul>
        </div>
        <div class="card flat">
          <p class="small" style="color:var(--ink-soft)"><strong>El <code>clamp</code> no es adorno.</strong> Sin él, <code>acos(1.0)</code> produce gradiente infinito y la pérdida se vuelve NaN a las pocas épocas. Es el bug más reportado de esta capa.</p>
        </div>
        <div class="card flat">
          <p class="small" style="color:var(--ink-soft)">Con <code>m = 0</code> esto es un softmax coseno normal. Buena ablación de un minuto para ver cuánto aporta el margen.</p>
        </div>
      </div>
    </div>
  </div>
  <div class="notes">Vale la pena correr la ablación m=0 en vivo si da tiempo. Ver el recall subir al meter margen convence más que la fórmula.</div>
</section>

<!-- ============ CODIGO: EVALUACION ============ -->
<section class="slide" data-sec="Sesión 2 · El código" data-title="La evaluación congelada">
  <div class="head">
    <p class="eyebrow">El código · 4 de 4</p>
    <h2>La evaluación es idéntica para todos</h2>
  </div>
  <div class="fill">
    <div class="cols c2" style="align-items:start">
<pre><span class="kw">def</span> <span class="fn">evaluate</span>(model, gallery, query, device):
    zg, yg = embed_all(model, gallery, device)
    zq, yq = embed_all(model, query, device)

    <span class="cm"># todo normalizado ⇒ el producto punto ES el coseno</span>
    sim = zq @ zg.T                      <span class="cm"># (Nq, Ng)</span>

    <span class="cm"># una query nunca puede recuperarse a sí misma</span>
    sim[same_image_mask(query, gallery)] = -<span class="nu">2</span>

    order = sim.argsort(dim=<span class="nu">1</span>, descending=<span class="kw">True</span>)
    hits  = yg[order] == yq[:, <span class="kw">None</span>]

    <span class="kw">return</span> {
        <span class="st">"recall@1"</span>: hits[:, :<span class="nu">1</span>].any(<span class="nu">1</span>).float().mean(),
        <span class="st">"recall@5"</span>: hits[:, :<span class="nu">5</span>].any(<span class="nu">1</span>).float().mean(),
        <span class="st">"mAP"</span>:      mean_average_precision(hits),
        <span class="st">"tar@far=1e-2"</span>: tar_at_far(zq, yq, far=<span class="nu">1e-2</span>),
    }</pre>
      <div class="vlist">
        <div class="card" style="border-color:var(--green);border-width:1.5px">
          <h3>Regla del curso</h3>
          <p class="small" style="color:var(--ink-soft)">Este archivo no se toca. Ni para “mejorarlo”, ni para “adaptarlo a mi dataset”. Si creen que tiene un bug, díganmelo y lo arreglo <strong>para todos</strong>.</p>
        </div>
        <div class="card flat">
          <h3>Por qué importa tanto</h3>
          <p class="small" style="color:var(--ink-soft)">En la sesión 3 vamos a poner sus números en la misma tabla. Si cada quien mide a su manera, la tabla es decorativa y la sesión se vuelve una serie de anécdotas.</p>
        </div>
        <div class="card flat">
          <p class="small" style="color:var(--ink-soft)">Fíjense en la línea del <code>-2</code>: es la implementación de “la query no cuenta como su propio acierto”. Sin ella todos los recall dan casi 1.0.</p>
        </div>
      </div>
    </div>
  </div>
</section>

const stage = document.getElementById("stage");
const tpl = document.getElementById("deck");

const slides = Array.from(tpl.content.querySelectorAll("section.slide"));
let shown = 0;
slides.forEach(s => {
  if (!s.hasAttribute("data-nonum")) shown++;
  const r = document.createElement("div");
  r.className = "ribbon";
  const img = document.createElement("img");
  img.src = LOGO; img.alt = "ITAM";
  const sep = document.createElement("span"); sep.className = "sep";
  const w = document.createElement("span"); w.className = "where";
  w.textContent = s.dataset.sec || "";
  const n = document.createElement("span"); n.className = "num";
  n.textContent = s.hasAttribute("data-nonum") ? "" : String(shown);
  r.append(img, sep, w, n);
  s.appendChild(r);
  stage.appendChild(s);
});

const all = Array.from(stage.querySelectorAll("section.slide"));
const notesBox = document.getElementById("notes");
let i = 0;

function render() {
  all.forEach((s, k) => s.classList.toggle("on", k === i));
  const nt = all[i].querySelector(".notes");
  notesBox.innerHTML = nt ? nt.innerHTML
    : '<span style="opacity:.5">Sin notas para esta lámina.</span>';
  document.querySelectorAll("#idxGrid button").forEach((b, k) =>
    b.classList.toggle("cur", k === i));
  const h = "#" + (i + 1);
  if (location.hash !== h) history.replaceState(null, "", h);
}
function go(n) { i = Math.max(0, Math.min(all.length - 1, n)); render(); }

// --- índice, agrupado por sesión ---
const grid = document.getElementById("idxGrid");
const groups = new Map();
all.forEach((s, k) => {
  const key = (s.dataset.sec || "").split(" · ")[0];
  if (!groups.has(key)) groups.set(key, []);
  groups.get(key).push([k, s]);
});
for (const [name, items] of groups) {
  const box = document.createElement("div");
  const h = document.createElement("h3"); h.textContent = name;
  const ol = document.createElement("ol");
  items.forEach(([k, s]) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = "<i>" + (k + 1) + "</i><span></span>";
    b.querySelector("span").textContent = s.dataset.title || "";
    b.onclick = () => { document.body.classList.remove("show-index"); go(k); };
    li.appendChild(b); ol.appendChild(li);
  });
  box.append(h, ol); grid.appendChild(box);
}

// --- escala del escenario ---
function fit() {
  const pad = document.body.classList.contains("show-notes") ? 0.68 : 1;
  const s = Math.min(innerWidth / 1280, (innerHeight * pad) / 720);
  stage.style.transform = "scale(" + s + ")";
}
addEventListener("resize", fit);

// --- teclado ---
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (["ArrowRight", " ", "PageDown", "j", "n"].includes(k)) { go(i + 1); e.preventDefault(); }
  else if (["ArrowLeft", "PageUp", "k", "p"].includes(k)) { go(i - 1); e.preventDefault(); }
  else if (k === "Home") go(0);
  else if (k === "End") go(all.length - 1);
  else if (k === "o" || k === "O") document.body.classList.toggle("show-index");
  else if (k === "s" || k === "S") { document.body.classList.toggle("show-notes"); fit(); }
  else if (k === "f" || k === "F") {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }
  else if (k === "Escape") document.body.classList.remove("show-index");
});

// --- clic para avanzar (no sobre el índice ni sobre las notas) ---
document.getElementById("viewport").addEventListener("click", e => {
  if (document.body.classList.contains("show-index")) return;
  go(e.clientX < innerWidth * 0.18 ? i - 1 : i + 1);
});

const start = parseInt(location.hash.slice(1), 10);
if (Number.isFinite(start) && start >= 1 && start <= all.length) i = start - 1;
render(); fit();
</script>
